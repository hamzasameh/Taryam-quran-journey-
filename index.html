<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f3d2d">
  <title>رحلة تريام القرآنية</title>
  <link rel="stylesheet" href="styles.css">
  <script src="data.js" defer></script>
  <script src="quran-text.js" defer></script>
  <script src="tafsir-data.js" defer></script>
  <script src="classroom.js?v=round-replay-1" defer></script>
  <script src="app.js" defer></script>
</head>
<body>

  <!-- ══════════════════════════════════════════
       HERO HEADER — full green band
  ══════════════════════════════════════════ -->
  <header class="site-header">

    <!-- Gold + green stripe at very top -->
    <div class="header-stripe" aria-hidden="true"></div>

    <!-- Islamic geometric SVG border (top) -->
    <div class="geo-border geo-border--top" aria-hidden="true">
      <svg viewBox="0 0 400 18" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <pattern id="gp" x="0" y="0" width="40" height="18" patternUnits="userSpaceOnUse">
          <!-- 8-pointed star fragment repeated -->
          <polygon points="20,1 23,8 30,8 25,13 27,20 20,16 13,20 15,13 10,8 17,8" fill="none" stroke="#c9a84c" stroke-width="0.8" opacity="0.55"/>
        </pattern>
        <rect width="400" height="18" fill="url(#gp)"/>
      </svg>
    </div>

    <!-- Decorative corner rosettes -->
    <div class="header-inner">

      <!-- Left rosette -->
      <svg class="rosette rosette--start" aria-hidden="true" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#c9a84c" stroke-width="0.9" opacity="0.5">
          <circle cx="30" cy="30" r="26"/>
          <circle cx="30" cy="30" r="18"/>
          <circle cx="30" cy="30" r="10"/>
          <line x1="30" y1="4"  x2="30" y2="56"/>
          <line x1="4"  y1="30" x2="56" y2="30"/>
          <line x1="11" y1="11" x2="49" y2="49"/>
          <line x1="49" y1="11" x2="11" y2="49"/>
          <polygon points="30,6 33,24 30,22 27,24" fill="#c9a84c" opacity="0.4"/>
          <polygon points="30,54 33,36 30,38 27,36" fill="#c9a84c" opacity="0.4"/>
          <polygon points="6,30 24,33 22,30 24,27" fill="#c9a84c" opacity="0.4"/>
          <polygon points="54,30 36,33 38,30 36,27" fill="#c9a84c" opacity="0.4"/>
        </g>
      </svg>

      <!-- Centre: school name + Bismillah -->
      <div class="header-centre">
        <p class="school-name">مدرسة تريام الأمريكية الخاصة</p>
        <p class="bismillah-text" aria-label="بسم الله الرحمن الرحيم">
          بِسْمِ اللهِ الرَّحْمٰنِ الرَّحِيْمِ
        </p>
        <p class="site-title-sub">رحلة تريام القرآنية</p>
      </div>

      <!-- Right rosette (mirrored) -->
      <svg class="rosette rosette--end" aria-hidden="true" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
        <g fill="none" stroke="#c9a84c" stroke-width="0.9" opacity="0.5">
          <circle cx="30" cy="30" r="26"/>
          <circle cx="30" cy="30" r="18"/>
          <circle cx="30" cy="30" r="10"/>
          <line x1="30" y1="4"  x2="30" y2="56"/>
          <line x1="4"  y1="30" x2="56" y2="30"/>
          <line x1="11" y1="11" x2="49" y2="49"/>
          <line x1="49" y1="11" x2="11" y2="49"/>
          <polygon points="30,6 33,24 30,22 27,24" fill="#c9a84c" opacity="0.4"/>
          <polygon points="30,54 33,36 30,38 27,36" fill="#c9a84c" opacity="0.4"/>
          <polygon points="6,30 24,33 22,30 24,27" fill="#c9a84c" opacity="0.4"/>
          <polygon points="54,30 36,33 38,30 36,27" fill="#c9a84c" opacity="0.4"/>
        </g>
      </svg>

    </div><!-- /.header-inner -->

    <!-- Islamic geometric SVG border (bottom) -->
    <div class="geo-border geo-border--bottom" aria-hidden="true">
      <svg viewBox="0 0 400 18" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <use href="#gp"/>
        <rect width="400" height="18" fill="url(#gp)"/>
      </svg>
    </div>

  </header><!-- /.site-header -->

  <main class="page-shell">
    <h1 id="page-title" class="sr-only">رحلة تريام القرآنية</h1>
    <section class="welcome-banner" aria-label="مرحبًا بك في رحلة تريام القرآنية">
      <svg class="welcome-emblem" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M67 14a39 39 0 1 0 19 69A34 34 0 0 1 67 14Z" fill="currentColor"/>
        <path d="m78 24 3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1Z" fill="#fff6d8"/>
      </svg>
      <div class="welcome-message">
        <p class="welcome-kicker">أهلًا بك في رحلة التعلّم!</p>
        <p class="welcome-copy">اختر صفّك، واكتشف معاني الآيات خطوةً خطوة.</p>
      </div>
      <span class="welcome-sparkles" aria-hidden="true">✦　✧　✦</span>
    </section>
    <nav class="mode-navigation" aria-label="وضع الموقع">
      <button id="meanings-mode-tab" class="mode-tab" type="button" data-mode="meanings" aria-pressed="true">معاني الكلمات</button>
      <button id="quiz-mode-tab" class="mode-tab" type="button" data-mode="classroom" aria-pressed="false">لعبة الصف</button>
      <button id="solo-quiz-mode-tab" class="mode-tab" type="button" data-mode="quiz" aria-pressed="false" disabled>تدرّب وحدك</button>
    </nav>

    <section class="search-section" aria-label="البحث في المقررات">
      <label for="site-search">ابحث عن سورة أو كلمة</label>
      <input id="site-search" type="search" placeholder="مثال: الإخلاص، الصمد، الصبر" autocomplete="off">
      <div id="search-results" class="search-results" aria-live="polite" hidden></div>
    </section>

    <section class="selection-section" aria-labelledby="grades-title">
      <h2 id="grades-title">اختر صفّك</h2>
      <p id="grade-hint" class="section-hint">اختر صفّك لعرض السور المقررة لك.</p>
      <nav id="grade-navigation" class="grade-navigation" aria-label="الصفوف الدراسية"></nav>
    </section>

    <section id="surahs-section" class="selection-section" aria-labelledby="surahs-title" hidden>
      <h2 id="surahs-title">اختر السورة أو الآية</h2>
      <div class="surah-section-tools">
        <p id="surah-hint" class="section-hint"></p>
        <button id="home-button" class="text-button" type="button">العودة لاختيار الصف</button>
      </div>
      <nav id="surah-navigation" class="surah-navigation" aria-label="السور والآيات المقررة"></nav>
    </section>

    <section id="lesson" class="lesson" aria-live="polite"></section>
  </main>

  <footer class="site-footer">
    <!-- Decorative SVG divider -->
    <svg class="footer-divider" aria-hidden="true" viewBox="0 0 300 12" xmlns="http://www.w3.org/2000/svg">
      <line x1="0" y1="6" x2="110" y2="6" stroke="#d8c99a" stroke-width="1"/>
      <polygon points="150,1 155,6 150,11 145,6" fill="#c9a84c" opacity="0.7"/>
      <circle cx="130" cy="6" r="2" fill="#c9a84c" opacity="0.5"/>
      <circle cx="170" cy="6" r="2" fill="#c9a84c" opacity="0.5"/>
      <line x1="190" y1="6" x2="300" y2="6" stroke="#d8c99a" stroke-width="1"/>
    </svg>
    <a href="https://e-quran.com/indx-word.html" target="_blank" rel="noopener noreferrer">المصدر: المصحف الإلكتروني</a>
  </footer>
</body>
</html>
